<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient matching app: #0a0a0c → #1a1a2e -->
    <radialGradient id="bg" cx="40%" cy="35%" r="75%">
      <stop offset="0%"   stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#050510"/>
    </radialGradient>

    <!-- Grid pattern clipped to rounded rect -->
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0L0 0 0 50" fill="none" stroke="#00f2ff" stroke-width="0.6" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="round-clip">
      <rect width="512" height="512" rx="72"/>
    </clipPath>

    <!-- Glow filters -->
    <filter id="glow-sm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-md" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-lg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Book page gradients -->
    <linearGradient id="page-l" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00f2ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#9d00ff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="page-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00f2ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#9d00ff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="72" fill="url(#bg)"/>

  <!-- Grid overlay -->
  <rect width="512" height="512" fill="url(#grid)" clip-path="url(#round-clip)"/>

  <!-- Purple inner ambient glow (bottom-right) -->
  <ellipse cx="380" cy="390" rx="160" ry="130" fill="#9d00ff" fill-opacity="0.07"/>

  <!-- ── Corner brackets ── -->
  <!-- Top-left -->
  <polyline points="48,92 48,46 92,46"   stroke="#00f2ff" stroke-width="9" fill="none" stroke-linecap="square" filter="url(#glow-sm)"/>
  <!-- Top-right -->
  <polyline points="420,46 464,46 464,92" stroke="#00f2ff" stroke-width="9" fill="none" stroke-linecap="square" filter="url(#glow-sm)"/>
  <!-- Bottom-left -->
  <polyline points="48,420 48,466 92,466" stroke="#00f2ff" stroke-width="9" fill="none" stroke-linecap="square" filter="url(#glow-sm)"/>
  <!-- Bottom-right -->
  <polyline points="420,466 464,466 464,420" stroke="#00f2ff" stroke-width="9" fill="none" stroke-linecap="square" filter="url(#glow-sm)"/>

  <!-- ── Open book ── -->
  <!-- Page fills -->
  <path d="M256 138 Q188 122 96 138 L96 372 Q188 358 256 372" fill="url(#page-l)"/>
  <path d="M256 138 Q324 122 416 138 L416 372 Q324 358 256 372" fill="url(#page-r)"/>

  <!-- Book outline glow layer (blurred backdrop) -->
  <g filter="url(#glow-lg)" opacity="0.6">
    <path d="M256 138 Q188 122 96 138 L96 372 Q188 358 256 372"
          fill="none" stroke="#00f2ff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M256 138 Q324 122 416 138 L416 372 Q324 358 256 372"
          fill="none" stroke="#00f2ff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="256" y1="138" x2="256" y2="372" stroke="#00f2ff" stroke-width="5"/>
  </g>

  <!-- Book outline sharp layer -->
  <path d="M256 138 Q188 122 96 138 L96 372 Q188 358 256 372"
        fill="none" stroke="#00f2ff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M256 138 Q324 122 416 138 L416 372 Q324 358 256 372"
        fill="none" stroke="#00f2ff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Spine -->
  <line x1="256" y1="138" x2="256" y2="372" stroke="#00f2ff" stroke-width="5" opacity="0.75" filter="url(#glow-sm)"/>

  <!-- Text lines — left page -->
  <g filter="url(#glow-sm)">
    <line x1="120" y1="196" x2="238" y2="192" stroke="#00f2ff" stroke-width="4.5" stroke-linecap="round" opacity="0.80"/>
    <line x1="120" y1="224" x2="238" y2="220" stroke="#00f2ff" stroke-width="4"   stroke-linecap="round" opacity="0.58"/>
    <line x1="120" y1="252" x2="210" y2="249" stroke="#00f2ff" stroke-width="4"   stroke-linecap="round" opacity="0.38"/>
    <line x1="120" y1="280" x2="238" y2="277" stroke="#00f2ff" stroke-width="3.5" stroke-linecap="round" opacity="0.20"/>
  </g>

  <!-- Text lines — right page -->
  <g filter="url(#glow-sm)">
    <line x1="274" y1="192" x2="392" y2="196" stroke="#00f2ff" stroke-width="4.5" stroke-linecap="round" opacity="0.80"/>
    <line x1="274" y1="220" x2="392" y2="224" stroke="#00f2ff" stroke-width="4"   stroke-linecap="round" opacity="0.58"/>
    <line x1="274" y1="249" x2="360" y2="252" stroke="#00f2ff" stroke-width="4"   stroke-linecap="round" opacity="0.38"/>
    <line x1="274" y1="277" x2="392" y2="280" stroke="#00f2ff" stroke-width="3.5" stroke-linecap="round" opacity="0.20"/>
  </g>

  <!-- ── LIBRA label ── -->
  <text x="256" y="445" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="38" font-weight="bold" letter-spacing="14"
        fill="#00f2ff" opacity="0.88"
        filter="url(#glow-md)">LIBRA</text>

  <!-- Thin bottom rule under label -->
  <line x1="148" y1="456" x2="364" y2="456" stroke="#00f2ff" stroke-width="1.5" opacity="0.25"/>
</svg>
