  <polyline points="424,44 468,44 468,88" stroke="#00f2ff" stroke-width="10" fill="none" stroke-linecap="square"/>
  <polyline points="44,424 44,468 88,468" stroke="#00f2ff" stroke-width="10" fill="none" stroke-linecap="square"/>
