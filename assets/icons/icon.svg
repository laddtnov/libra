  <line x1="126" y1="234" x2="234" y2="230" stroke="#00f2ff" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  <line x1="126" y1="264" x2="200" y2="261" stroke="#00f2ff" stroke-width="5" stroke-linecap="round" opacity="0.25"/>

  <!-- Text lines — right page -->
  <line x1="278" y1="200" x2="386" y2="204" stroke="#00f2ff" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <line x1="278" y1="230" x2="386" y2="234" stroke="#00f2ff" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  <line x1="278" y1="261" x2="352" y2="264" stroke="#00f2ff" stroke-width="5" stroke-linecap="round" opacity="0.25"/>
