<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Book Tracker</title>
  <meta name="description" content="A personal reading tracker with a full cyberpunk neon UI — glitch title, status-colored book spines, Open Library auto-fill, and a Fallout-style detail terminal.">
  <meta property="og:title" content="Cyberpunk Book Tracker">
  <meta property="og:description" content="A personal reading tracker with a full cyberpunk neon UI — glitch title, status-colored book spines, Open Library auto-fill, and a Fallout-style detail terminal.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://book-archive.laddtnov.xyz/">
  <meta property="og:image" content="https://book-archive.laddtnov.xyz/Screenshot-book-desktop.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Cyberpunk Book Tracker">
  <meta name="twitter:description" content="A personal reading tracker with a full cyberpunk neon UI">
  <meta name="twitter:image" content="https://book-archive.laddtnov.xyz/Screenshot-book-desktop.png">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="cyber-grid"></div>

  <div class="container">

    <!-- Header with Stats -->
    <header class="header">
      <div class="title-section">
        <h1 class="glitch" data-text="BOOK.ARCHIVE">BOOK.ARCHIVE</h1>
        <p class="tagline">&gt;_ Digital library v2.0</p>
      </div>

      <!-- Stats Dashboard -->
      <div class="stats-grid">
        <div class="stat-card" data-filter="completed">
          <div class="stat-icon">
            <!-- Hexagon checkmark -->
            <svg class="stat-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polygon points="18,2 33,10 33,26 18,34 3,26 3,10" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
              <polygon points="18,7 28,13 28,23 18,29 8,23 8,13" stroke="currentColor" stroke-width="1.5"/>
              <polyline points="12,18 16,22 24,13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-number" id="stat-completed">0</span>
            <span class="stat-label">Completed</span>
          </div>
          <div class="stat-glow read"></div>
        </div>

        <div class="stat-card" data-filter="reading">
          <div class="stat-icon">
            <!-- Eye aperture -->
            <svg class="stat-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 18 C9 9 27 9 33 18 C27 27 9 27 3 18Z" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="18" cy="18" r="5.5" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="18" cy="18" r="2.2" fill="currentColor"/>
              <line x1="3" y1="18" x2="8" y2="18" stroke="currentColor" stroke-width="1" opacity="0.5"/>
              <line x1="28" y1="18" x2="33" y2="18" stroke="currentColor" stroke-width="1" opacity="0.5"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-number" id="stat-reading">0</span>
            <span class="stat-label">Reading</span>
          </div>
          <div class="stat-glow progress"></div>
        </div>

        <div class="stat-card" data-filter="to-read">
          <div class="stat-icon">
            <!-- Queue stack -->
            <svg class="stat-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="4" y="5" width="28" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
              <rect x="4" y="15" width="22" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
              <rect x="4" y="25" width="14" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-number" id="stat-queued">0</span>
            <span class="stat-label">Queued</span>
          </div>
          <div class="stat-glow toread"></div>
        </div>

        <div class="stat-card" data-filter="all">
          <div class="stat-icon">
            <!-- Circuit grid -->
            <svg class="stat-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="3" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <rect x="21" y="3" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <rect x="3" y="21" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <rect x="21" y="21" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <line x1="15" y1="9" x2="21" y2="9" stroke="currentColor" stroke-width="1.5"/>
              <line x1="15" y1="27" x2="21" y2="27" stroke="currentColor" stroke-width="1.5"/>
              <line x1="9" y1="15" x2="9" y2="21" stroke="currentColor" stroke-width="1.5"/>
              <line x1="27" y1="15" x2="27" y2="21" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-number" id="stat-total">0</span>
            <span class="stat-label">Total</span>
          </div>
          <div class="stat-glow total"></div>
        </div>
      </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrapper">
        <span class="search-prompt">&gt;_</span>
        <input type="text" id="search-input" class="search-input" placeholder="SEARCH ARCHIVE..." autocomplete="off" spellcheck="false">
      </div>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">ALL</button>
        <button class="filter-btn" data-filter="reading">READING</button>
        <button class="filter-btn" data-filter="completed">DONE</button>
        <button class="filter-btn" data-filter="to-read">QUEUED</button>
      </div>
      <div class="sort-wrapper">
        <select class="sort-select" id="sort-select">
          <option value="default">SORT</option>
          <option value="title-az">TITLE A→Z</option>
          <option value="title-za">TITLE Z→A</option>
          <option value="rating">RATING ↓</option>
          <option value="pages">PAGES ↓</option>
          <option value="added">DATE ADDED</option>
        </select>
      </div>
      <button class="lists-btn" id="lists-btn">📋 LISTS</button>
      <button class="recs-btn" id="recommend-btn">⚡ RECOMMEND</button>
      <button class="add-book-btn" id="add-book-btn">&gt; ADD BOOK</button>
      <div id="active-list-indicator" class="active-list-indicator" style="display:none"></div>
    </div>

    <!-- Books Grid (JS-rendered) -->
    <div class="books-grid" id="books-grid"></div>
  </div>

  <!-- Modal Overlay -->
  <div id="modal-overlay"></div>

  <!-- Book Details Modal -->
  <div id="book-modal">
    <div class="modal-container">
      <div class="scanlines"></div>
      <div class="modal-header">
        <div id="modal-sound-slot"></div>
        <button id="close-modal" class="close-btn">✕</button>
      </div>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Add / Edit Form Modal -->
  <div id="form-modal">
    <div class="form-modal-container">
      <div class="scanlines"></div>
      <button id="close-form-modal" class="close-btn">✕</button>
      <div id="form-modal-content"></div>
    </div>
  </div>

  <!-- Lists Panel -->
  <div id="lists-panel" style="display:none">
    <div class="lists-panel-container">
      <div class="scanlines"></div>
      <div class="lists-panel-header">
        <span class="lists-panel-title">&gt;_ READING LISTS</span>
        <button id="close-lists-panel" class="close-btn">✕</button>
      </div>
      <div class="lists-create-row">
        <input type="text" id="new-list-input" class="new-list-input" placeholder="LIST NAME..." maxlength="60" spellcheck="false" autocomplete="off">
        <button id="create-list-btn" class="create-list-submit">&gt; CREATE</button>
      </div>
      <div id="lists-container"></div>
    </div>
  </div>

  <!-- Recommendations Panel -->
  <div id="recommendations-panel" style="display:none">
    <div class="recs-container">
      <div class="scanlines"></div>
      <div class="recs-header">
        <span class="recs-title">&gt;_ GENRE ANALYSIS</span>
        <button id="close-recs-panel" class="close-btn">✕</button>
      </div>
      <div id="recs-content"></div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <script type="module" src="js/app-ui.js"></script>
</body>
</html>
