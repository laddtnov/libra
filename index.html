<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libra — Cyberpunk Reading Tracker</title>
  <meta name="description" content="Libra — a personal reading tracker with a cyberpunk neon UI. Track, discover, and organise your books.">
  <meta property="og:title" content="Libra">
  <meta property="og:description" content="Libra — a personal reading tracker with a cyberpunk neon UI. Track, discover, and organise your books.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://libra.laddtnov.xyz/">
  <meta property="og:image" content="https://libra.laddtnov.xyz/Screenshot-book-desktop.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Libra">
  <meta name="twitter:description" content="Libra — a personal reading tracker with a cyberpunk neon UI">
  <meta name="twitter:image" content="https://libra.laddtnov.xyz/Screenshot-book-desktop.png">
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/libra-icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/libra-icon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/libra-icon-48.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00f2ff">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
</head>
<body>
  <a href="#books-grid" class="skip-link">Skip to book grid</a>
  <div class="cyber-grid" aria-hidden="true"></div>

  <main class="container">

    <!-- Header with Stats -->
    <header class="header">
      <div class="title-section">
        <h1 class="glitch" data-text="LIBRA">LIBRA</h1>
        <p class="tagline">&gt;_ Digital library v2.0</p>
        <div class="lang-switcher">
          <select class="lang-select" id="lang-select" aria-label="Language">
            <option value="en">EN</option>
            <option value="uk">UA</option>
            <option value="es">ES</option>
            <option value="ru">RU</option>
            <option value="de">DE</option>
            <option value="pl">PL</option>
          </select>
          <button id="auth-badge" data-state="signed-out" title="Sign in to sync across devices">[ SIGN IN ]</button>
          <button id="logout-btn" class="logout-btn" style="display:none">[ LOG OUT ]</button>
        </div>
      </div>

      <!-- Stats Dashboard -->
      <h2 class="sr-only">Reading statistics</h2>
      <div class="stats-grid">
        <div class="stat-card" data-filter="completed">
          <div class="stat-icon">
            <!-- Hexagon checkmark -->
            <svg class="stat-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polygon points="18,2 33,10 33,26 18,34 3,26 3,10" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
              <polygon points="18,7 28,13 28,23 18,29 8,23 8,13" stroke="currentColor" stroke-width="1.5"/>
              <polyline points="12,18 16,22 24,13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-number" id="stat-completed">0</span>
            <span class="stat-label" data-i18n="stat_completed">Completed</span>
          </div>
          <div class="stat-glow read"></div>
        </div>

        <div class="stat-card" data-filter="reading">
          <div class="stat-icon">
            <!-- Eye aperture -->
            <svg class="stat-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 18 C9 9 27 9 33 18 C27 27 9 27 3 18Z" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="18" cy="18" r="5.5" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="18" cy="18" r="2.2" fill="currentColor"/>
              <line x1="3" y1="18" x2="8" y2="18" stroke="currentColor" stroke-width="1" opacity="0.5"/>
              <line x1="28" y1="18" x2="33" y2="18" stroke="currentColor" stroke-width="1" opacity="0.5"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-number" id="stat-reading">0</span>
            <span class="stat-label" data-i18n="stat_reading">Reading</span>
          </div>
          <div class="stat-glow progress"></div>
        </div>

        <div class="stat-card" data-filter="to-read">
          <div class="stat-icon">
            <!-- Queue stack -->
            <svg class="stat-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="4" y="5" width="28" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
              <rect x="4" y="15" width="22" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
              <rect x="4" y="25" width="14" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-number" id="stat-queued">0</span>
            <span class="stat-label" data-i18n="stat_queued">Queued</span>
          </div>
          <div class="stat-glow toread"></div>
        </div>

        <div class="stat-card" data-filter="all">
          <div class="stat-icon">
            <!-- Circuit grid -->
            <svg class="stat-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="3" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <rect x="21" y="3" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <rect x="3" y="21" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <rect x="21" y="21" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <line x1="15" y1="9" x2="21" y2="9" stroke="currentColor" stroke-width="1.5"/>
              <line x1="15" y1="27" x2="21" y2="27" stroke="currentColor" stroke-width="1.5"/>
              <line x1="9" y1="15" x2="9" y2="21" stroke="currentColor" stroke-width="1.5"/>
              <line x1="27" y1="15" x2="27" y2="21" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-number" id="stat-total">0</span>
            <span class="stat-label" data-i18n="stat_total">Total</span>
          </div>
          <div class="stat-glow total"></div>
        </div>
      </div>

      <!-- Reading Goal + Streak -->
      <div class="goal-streak-row">
        <div class="goal-bar-wrap" id="goal-bar-wrap">
          <div class="goal-bar-header">
            <span class="goal-label" id="goal-label">&gt; READING GOAL <span id="goal-year"></span></span>
            <div style="display:flex;gap:5px;">
              <button class="goal-edit-btn" id="goal-edit-btn">[ SET ]</button>
              <button class="goal-edit-btn" id="genre-goal-btn" title="Add per-genre goal">[ + GENRE ]</button>
            </div>
          </div>
          <div class="goal-track">
            <div class="goal-fill" id="goal-fill"></div>
          </div>
          <div class="goal-meta" id="goal-meta"></div>
          <div id="genre-goals-container"></div>
          <div id="reading-reminders"></div>
        </div>
        <div class="streak-badge" id="streak-badge">
          <span class="streak-icon">🔥</span>
          <span class="streak-count" id="streak-count">0</span>
          <span class="streak-label">DAY STREAK</span>
        </div>
      </div>
    </header>

    <h2 class="sr-only">Book library</h2>

    <!-- Toolbar -->
    <div class="toolbar" role="toolbar" aria-label="Main toolbar">
      <div class="search-wrapper">
        <span class="search-prompt">&gt;_</span>
        <input type="text" id="search-input" class="search-input" placeholder="Search archive..." data-i18n-ph="search_placeholder" autocomplete="off" spellcheck="false" aria-label="Search archive">
      </div>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all" data-i18n="filter_all">ALL</button>
        <button class="filter-btn" data-filter="reading" data-i18n="filter_reading">READING</button>
        <button class="filter-btn" data-filter="completed" data-i18n="filter_done">DONE</button>
        <button class="filter-btn" data-filter="to-read" data-i18n="filter_queued">QUEUED</button>
      </div>
      <div class="sort-wrapper">
        <select class="sort-select" id="sort-select" aria-label="Sort order">
          <option value="default" data-i18n="sort_default">SORT</option>
          <option value="title-az" data-i18n="sort_title_az">TITLE A→Z</option>
          <option value="title-za" data-i18n="sort_title_za">TITLE Z→A</option>
          <option value="rating" data-i18n="sort_rating">RATING ↓</option>
          <option value="pages" data-i18n="sort_pages">PAGES ↓</option>
          <option value="added" data-i18n="sort_added">DATE ADDED</option>
        </select>
      </div>
      <button class="select-mode-btn" id="select-mode-btn" data-i18n="btn_select">☑ SELECT</button>
      <button class="lists-btn" id="lists-btn">
        <svg class="btn-svg" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="3.5" cy="5" r="1.2" fill="currentColor"/>
          <line x1="6.5" y1="5" x2="17" y2="5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="3.5" cy="10" r="1.2" fill="currentColor"/>
          <line x1="6.5" y1="10" x2="17" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="3.5" cy="15" r="1.2" fill="currentColor"/>
          <line x1="6.5" y1="15" x2="14" y2="15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span data-i18n="btn_lists">LISTS</span>
      </button>
      <button class="stats-btn" id="stats-btn">
        <svg class="btn-svg" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <line x1="4"  y1="16" x2="4"  y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="10" y1="16" x2="10" y2="4"  stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="16" y1="16" x2="16" y2="8"  stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span data-i18n="btn_stats">STATS</span>
      </button>
      <button class="recs-btn" id="recommend-btn" data-i18n="btn_recommend">⚡ RECOMMEND</button>
      <a class="support-btn" href="https://buymeacoffee.com/laddtnov" target="_blank" rel="noopener noreferrer" aria-label="Support on Buy Me a Coffee">♥ SUPPORT</a>
      <button class="add-book-btn" id="add-book-btn" data-i18n="btn_add_book">&gt; ADD BOOK</button>
      <div class="backup-btns">
        <select class="backup-btn export-select" id="export-select" aria-label="Export library">
          <option value="" data-i18n="btn_export">↓ EXPORT</option>
          <option value="json" data-i18n="btn_export_json">JSON</option>
          <option value="csv" data-i18n="btn_export_csv">CSV</option>
        </select>
        <label class="backup-btn import-btn" id="import-label" title="Import a Libra backup (.json) or a Goodreads export (.csv)">
          <span data-i18n="btn_import">↑ IMPORT</span>
          <input type="file" id="import-input" accept=".json,.csv" style="display:none">
        </label>
      </div>
      <button class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Toggle light/dark theme">☀</button>
      <div id="active-list-indicator" class="active-list-indicator" style="display:none"></div>
    </div>

    <!-- Bulk Action Bar (shown in select mode) -->
    <div id="bulk-action-bar" class="bulk-action-bar" style="display:none"></div>

    <!-- Web Discover Section (shown when search bar is active) -->
    <div id="discover-section" style="display:none"></div>

    <!-- Books Grid (JS-rendered) -->
    <div class="books-grid" id="books-grid"></div>
  </main>

  <!-- Modal Overlay -->
  <div id="modal-overlay"></div>

  <!-- Book Details Modal -->
  <dialog id="book-modal" aria-label="Book details">
    <div class="modal-container">
      <div class="scanlines" aria-hidden="true"></div>
      <div class="modal-header">
        <div id="modal-sound-slot"></div>
        <button id="close-modal" class="close-btn" aria-label="Close book details">✕</button>
      </div>
      <div id="modal-content"></div>
    </div>
  </dialog>

  <!-- Add / Edit Form Modal -->
  <dialog id="form-modal" aria-label="Add book">
    <div class="form-modal-container">
      <div class="scanlines" aria-hidden="true"></div>
      <button id="close-form-modal" class="close-btn" aria-label="Close form">✕</button>
      <div id="form-modal-content"></div>
    </div>
  </dialog>

  <!-- Lists Panel -->
  <dialog id="lists-panel" style="display:none" aria-labelledby="lists-panel-title">
    <div class="lists-panel-container">
      <div class="scanlines" aria-hidden="true"></div>
      <div class="lists-panel-header">
        <h2 class="lists-panel-title" id="lists-panel-title">&gt;_ READING LISTS</h2>
        <button id="close-lists-panel" class="close-btn" aria-label="Close reading lists">✕</button>
      </div>
      <div class="lists-create-row">
        <input type="text" id="new-list-input" class="new-list-input" placeholder="LIST NAME..." maxlength="60" spellcheck="false" autocomplete="off" aria-label="New reading list name">
        <button id="create-list-btn" class="create-list-submit">&gt; CREATE</button>
      </div>
      <div id="lists-container"></div>
    </div>
  </dialog>

  <!-- Recommendations Panel -->
  <dialog id="recommendations-panel" style="display:none" aria-labelledby="recs-panel-title">
    <div class="recs-container">
      <div class="scanlines" aria-hidden="true"></div>
      <div class="recs-header">
        <h2 class="recs-title" id="recs-panel-title">&gt;_ GENRE ANALYSIS</h2>
        <button id="close-recs-panel" class="close-btn" aria-label="Close recommendations">✕</button>
      </div>
      <div id="recs-content"></div>
    </div>
  </dialog>


  <!-- Stats Panel -->
  <dialog id="stats-panel" style="display:none" aria-labelledby="stats-panel-title">
    <div class="stats-container">
      <div class="stats-header">
        <h2 class="stats-title" id="stats-panel-title">&gt;_ READING STATS</h2>
        <button id="close-stats-panel" class="close-btn" aria-label="Close stats">✕</button>
      </div>
      <div id="stats-content"></div>
    </div>
  </dialog>

  <!-- Discover Book Preview Modal -->
  <dialog id="discover-preview" style="display:none" aria-label="Book preview">
    <div class="discover-preview-container">
      <div class="scanlines" aria-hidden="true"></div>
      <button id="close-discover-preview" class="close-btn" aria-label="Close book preview">✕</button>
      <div id="discover-preview-content"></div>
    </div>
  </dialog>

  <!-- Auth overlay -->
  <dialog id="auth-overlay" style="display:none" aria-label="Account">
    <div class="auth-container">
      <div id="auth-content"></div>
    </div>
  </dialog>

  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <!-- Detect password reset redirect before modules load -->
  <script>
    if (new URLSearchParams(location.search).get('reset') === '1') {
      sessionStorage.setItem('libra-recovery', '1');
    }
  </script>
  <script src="js/vendor/supabase.min.js"></script>
  <script type="module" src="js/app-ui.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
